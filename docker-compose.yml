version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: study-companion-db
    environment:
      POSTGRES_DB: studycompanion
      POSTGRES_USER: studyuser
      POSTGRES_PASSWORD: studypass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: study-companion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: study-companion-app
    environment:
      - DATABASE_URL=postgresql://studyuser:studypass@postgres:5432/studycompanion
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    command: python src/api.py

  telegram-bot:
    build: .
    container_name: study-companion-telegram
    environment:
      - DATABASE_URL=postgresql://studyuser:studypass@postgres:5432/studycompanion
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    command: python src/telegram_bot.py

  n8n:
    image: n8nio/n8n:latest
    container_name: study-companion-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=UTC
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/workflows
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  n8n_data:
